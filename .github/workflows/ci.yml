name: PeleAnalysis-CI

on:
   workflow_dispatch:
   push:
     branches: [development]
   pull_request:
     branches: [development]

concurrency:
  group: ${{github.ref}}-${{github.head_ref}}-ci
  cancel-in-progress: true

jobs:

# This is mostly just copied from the PelePhysics CI
# and pruned somewhat. Stuff to add back indicated
# with TODOs
